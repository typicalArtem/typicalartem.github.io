<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Media Downloader</title>
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>📥 Social Media Downloader</h1>
      <p class="subtitle">Download content from YouTube, Instagram & TikTok</p>
    </header>

    <div class="content">
      <div class="platform-info" id="platformInfo">
        <div class="platform-icon">🌐</div>
        <p>Navigate to a supported platform to start downloading</p>
      </div>

      <div class="download-section" id="downloadSection" style="display: none;">
        <div class="media-preview" id="mediaPreview">
          <!-- Media preview will be populated by JavaScript -->
        </div>

        <div class="download-options">
          <div class="quality-selector">
            <label for="qualitySelect">Quality:</label>
            <select id="qualitySelect">
              <option value="best">Best Quality</option>
              <option value="720p">720p</option>
              <option value="480p">480p</option>
              <option value="360p">360p</option>
            </select>
          </div>

          <div class="format-selector">
            <label for="formatSelect">Format:</label>
            <select id="formatSelect">
              <option value="video">Video (MP4)</option>
              <option value="audio">Audio Only (MP3)</option>
            </select>
          </div>

          <button id="downloadBtn" class="download-btn">
            <span class="btn-icon">⬇️</span>
            <span class="btn-text">Download</span>
          </button>
        </div>
      </div>

      <div class="status" id="status"></div>

      <div class="history-section">
        <h3>Recent Downloads</h3>
        <div class="history-list" id="historyList">
          <p class="empty-state">No downloads yet</p>
        </div>
      </div>
    </div>

    <footer class="footer">
      <p>Supports YouTube, Instagram & TikTok</p>
      <div class="links">
        <a href="#" id="settingsBtn">⚙️ Settings</a>
        <a href="#" id="helpBtn">❓ Help</a>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
